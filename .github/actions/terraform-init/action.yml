name: Terraform init
description: Install the pinned Terraform version and initialize the working directory.

inputs:
  terraform-version:
    description: Terraform version to install
    default: '1.16.4'

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
    - name: Terraform Init
      shell: bash
      run: terraform init -input=false
