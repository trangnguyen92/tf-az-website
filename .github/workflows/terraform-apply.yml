# .github/workflows/terraform-apply.yml
name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - 'cloud-init/**'
      - '.github/workflows/terraform-apply.yml'
  # Manual trigger — e.g. after updating the OPERATOR_IPS secret, so a
  # re-apply doesn't require a throwaway commit to satisfy the paths filter.
  workflow_dispatch: {}

# Serialize with the CI/destroy workflows: they share one remote state lock.
concurrency:
  group: terraform-state
  cancel-in-progress: false

permissions:
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  TF_VAR_operator_ips: ${{ secrets.OPERATOR_IPS }}
  TF_VAR_client_admin_password: ${{ secrets.CLIENT_ADMIN_PASSWORD }}
  TF_VAR_server_ssh_public_key: ${{ secrets.SERVER_SSH_PUBLIC_KEY }}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
