# .github/workflows/terraform-ci.yml
name: Terraform CI

on:
  pull_request:
    branches: [main]

# Serialize with the apply/destroy workflows: they share one remote state lock.
concurrency:
  group: terraform-state
  cancel-in-progress: false

permissions:
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  TF_VAR_operator_ips: ${{ secrets.OPERATOR_IPS }}
  TF_VAR_client_admin_password: ${{ secrets.CLIENT_ADMIN_PASSWORD }}
  TF_VAR_server_ssh_public_key: ${{ secrets.SERVER_SSH_PUBLIC_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      - name: Terraform Init
        run: terraform init
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -input=false
